<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anh Thu Do</title>
    <meta
      name="description"
      content="Personal website and portfolio of Anh Thu Do — Mathematics of Computation student at UCLA."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main>
      <section class="table" aria-label="A deck of hearts, topped by the ace of hearts">
        <div class="stage">
          <div class="deck" id="deck"></div>
          <div class="intro" id="intro" hidden>
            <h1 class="intro-title">
              Hi, I'm <span class="accent">Anh Thu Do</span>,<br />a full-stack developer!
            </h1>
            <button type="button" class="btn-more" id="learnMore">
              About Me <span class="btn-more-arrow" aria-hidden="true">&rarr;</span>
            </button>
          </div>
        </div>

        <div class="picker" id="picker" hidden>
          <p class="picker-prompt">Pick a card</p>
          <div class="hand" id="hand"></div>
          <button type="button" class="btn-back" id="backToIntro">&larr; Back</button>
        </div>
      </section>

      <section id="contact" class="section">
        <h2 class="section-title">Contact</h2>
        <div class="contact-row">
          <div class="contact-links">
            <a
              href="mailto:athudo@g.ucla.edu"
              class="contact-icon"
              aria-label="Email"
              title="Email"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </a>
            <a href="tel:+19165133257" class="contact-icon" aria-label="Phone" title="Phone">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"
                />
              </svg>
            </a>
            <a
              href="http://www.linkedin.com/in/anh-thu-do-atd"
              target="_blank"
              rel="noopener"
              class="contact-icon"
              aria-label="LinkedIn"
              title="LinkedIn"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.5V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"
                />
              </svg>
            </a>
            <a
              href="https://github.com/minado05"
              target="_blank"
              rel="noopener"
              class="contact-icon"
              aria-label="GitHub"
              title="GitHub"
            >
              <svg viewBox="0 0 16 16" fill="currentColor">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                />
              </svg>
            </a>
          </div>
          <p class="copyright">&copy; <span id="year"></span> Anh Thu Do.</p>
        </div>
      </section>
    </main>

    <dialog class="slideshow" id="slideshow" aria-labelledby="slideTitle">
      <div class="slideshow-panel">
        <button type="button" class="slideshow-close" id="slideClose" aria-label="Close">
          &times;
        </button>
        <p class="slideshow-card" id="slideCard"></p>
        <div class="slide" id="slide">
          <h2 class="slide-title" id="slideTitle"></h2>
          <div class="slide-media" id="slideMedia"></div>
          <p class="slide-body" id="slideBody"></p>
        </div>
        <div class="slideshow-nav">
          <button type="button" class="slide-arrow" id="slidePrev" aria-label="Previous slide">
            &larr;
          </button>
          <div class="slide-dots" id="slideDots"></div>
          <button type="button" class="slide-arrow" id="slideNext" aria-label="Next slide">
            &rarr;
          </button>
        </div>
      </div>
    </dialog>

    <script src="assets/js/cards-content.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
